version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: databob
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/databob?schema=public
      JWT_SECRET: dev-secret-change-in-production-minimum-32-chars-long
      CORS_ORIGIN: http://localhost:5173
      PORT: '3000'
    depends_on:
      - db

volumes:
  pgdata:
